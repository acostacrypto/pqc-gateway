[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-gateway-harness"
version = "0.1.0"
description = "Benchmarking and orchestration harness for hybrid TLS 1.3 handshakes (X25519 + ML-KEM-768)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Frank Ernesto Acosta Fonseca" }]
keywords = ["pqc", "tls1.3", "ml-kem", "hybrid", "devsecops", "benchmarking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Intended Audience :: Science/Research",
]
# The harness needs no runtime dependencies for the MVP: the handshake itself
# is performed by OpenSSL 3 + oqs-provider inside the Docker image.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "bandit>=1.7.9",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.pytest.ini_options]
pythonpath = ["src/python"]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src/python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
